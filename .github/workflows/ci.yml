name: FlowPilot CI-CD POC

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate Flow Files
        shell: powershell
        run: |
          Write-Output "Validating .flow files..."

          $flows = Get-ChildItem -Path pub -Recurse -Filter *.flow

          foreach ($flow in $flows) {
              $mdFile = $flow.FullName -replace "\.flow$", ".md"
              if (!(Test-Path $mdFile)) {
                  Write-Error "Missing .md file for $($flow.FullName)"
                  exit 1
              }
          }

          Write-Output "Validation Passed"

      - name: Deploy using Bob MCP
        shell: powershell
        run: |
          cd "C:\ProductManagement\BOB"
          node ".bob\skills\webmethods-developer\deployer\mcp\lib\mcp-fsl-server.js"

      - name: Deployment Complete
        run: echo "FlowPilot deployment complete"